name: ${COMPOSE_PROJECT_NAME:-humi}

networks:
  humi-net:
    driver: bridge

volumes:
  ollama_data:
  hf_cache:
  frontend_node_modules:

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    networks: [humi-net]
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    networks: [humi-net]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
    volumes:
      - hf_cache:/home/app/.cache/huggingface
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  gateway:
    build: ./gateway
    restart: unless-stopped
    networks: [humi-net]
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [humi-net]
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_GATEWAY_HTTP: http://gateway:8080
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      gateway:
        condition: service_healthy
