[project]
name = "humi-benchmarks"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "coqui-tts>=0.27.5",
    "faster-whisper>=1.2.1",
    "huggingface-hub>=0.36.2",
    "numpy",
    "piper-tts>=1.7.0",
    "soundfile",
    "torch>=2.5,<2.9",
    "torchaudio>=2.5,<2.9",
    "transformers>=4.57,<5",
]

[dependency-groups]
dev = ["ruff>=0.8"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
