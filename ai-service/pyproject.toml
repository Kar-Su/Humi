[project]
name = "humi-ai-service"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "faster-whisper>=1.0",
    "httpx>=0.27",
    "soundfile>=0.12",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = ["ruff>=0.8", "pytest>=8"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
