name: ${COMPOSE_PROJECT_NAME:-humi}

services:
  traefik:
    image: traefik:latest
    container_name: humi-traefik
    networks: [humi-net]
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.web.forwardedHeaders.insecure=true"
      - "--accessLog=true"
      - "--log.level=INFO"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-service.entrypoints=web"
      - "traefik.http.routers.traefik-service.rule=Host(`dashboard.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.traefik-service.service=api@internal"

  frontend:
    ports: !reset []

  gateway:
    ports: !reset []

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: humi-cloudflared
    networks: [humi-net]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TOKEN} --protocol http2
    volumes:
      - ./.docker/cloudflare:/etc/cloudflared
